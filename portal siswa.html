<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PORTAL SISWA - SMAN 1 SUNGGAL</title>

  <!-- Google Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      /* Mengubah latar belakang menjadi cerah dan berwarna lembut */
      background-color: #f0f4f8; 
      background-image: radial-gradient(#d1d5db 0.5px, transparent 0.5px);
      background-size: 20px 20px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #1e293b;
      margin: 0;
      padding-bottom: 50px;
    }

    /* Header cerah */
    .top-bar {
      background: white;
      padding: 15px 25px;
      border-bottom: 2px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .welcome-pill {
      background: #dcfce7;
      color: #15803d;
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 700;
      display: inline-block;
    }

    .app-brand {
      font-weight: 800;
      color: #1e40af;
      margin: 0;
      font-size: 1.2rem;
      line-height: 1.2;
    }

    .clock-box {
      background: #f8fafc;
      border: 2px solid #10b981;
      border-radius: 12px;
      padding: 5px 15px;
      text-align: center;
    }
    #datetime { font-weight: 800; color: #334155; font-size: 1.1rem; }

    .section-title {
      text-align: center;
      font-weight: 800;
      margin-top: 40px;
      color: #1e3a8a;
    }

    .subtitle-text {
      text-align: center;
      color: #64748b;
      margin-bottom: 40px;
      font-style: italic;
    }

    /* Card Styling agar berwarna tajam */
    .card-portal {
      border: none;
      border-radius: 20px;
      padding: 30px 20px;
      color: white;
      height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      text-decoration: none !important;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .card-portal:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }

    .card-portal h5 {
      font-weight: 800;
      font-size: 1.3rem;
      z-index: 2;
      margin: 0;
    }

    .card-portal i {
      font-size: 5rem;
      position: absolute;
      right: -10px;
      bottom: -15px;
      opacity: 0.2;
      transition: 0.3s;
    }

    .card-portal:hover i { opacity: 0.4; transform: rotate(-10deg); }

    /* Warna Gradasi sesuai image_731515.jpg */
    .bg-blue   { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .bg-orange { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .bg-red    { background: linear-gradient(135deg, #ef4444, #b91c1c); }
    .bg-cyan   { background: linear-gradient(135deg, #06b6d4, #0891b2); }
    .bg-green  { background: linear-gradient(135deg, #10b981, #047857); }
    .bg-purple { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }

    .user-tag {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 6px 12px;
      border-radius: 10px;
      font-weight: 600;
      color: #1e40af;
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="header-left">
      <div class="welcome-pill" id="greeting">Semangat Belajar! 🚀</div>
      <h1 class="app-brand">PORTAL SISWA<br>SMAN 1 SUNGGAL</h1>
    </div>
    
    <div class="header-center">
      <div class="clock-box">
        <div id="datetime">00:00:00 WIB</div>
        <small id="weather" style="color:#64748b; font-weight:600;"><i class="bi bi-geo-alt"></i> Medan: ...</small>
      </div>
    </div>

    <div class="header-right">
      <div class="dropdown">
        <button class="btn user-tag dropdown-toggle" type="button" data-bs-toggle="dropdown">
          <i class="bi bi-person-circle me-1"></i> Siswa SMAN 1
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow border-0">
          <li><a class="dropdown-item py-2" href="#" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
        </ul>
      </div>
    </div>
  </header>

  <div class="container">
    <h2 class="section-title">Dashboard Belajar</h2>
    <p class="subtitle-text">"Pendidikan adalah senjata paling ampuh yang bisa kamu gunakan untuk mengubah dunia."</p>

    <div class="row g-4">
      
      <div class="col-md-4">
        <a href="jadwal.html" class="card-portal bg-blue">
          <h5>Jadwal Pelajaran</h5>
          <i class="bi bi-calendar3"></i>
        </a>
      </div>

      <div class="col-md-4">
        <a href="tugas.html" class="card-portal bg-orange">
          <h5>Tugas & Proyek</h5>
          <i class="bi bi-clipboard-check"></i>
        </a>
      </div>

      <div class="col-md-4">
        <a href="nilai.html" class="card-portal bg-red">
          <h5>Nilai Akademik</h5>
          <i class="bi bi-graph-up-arrow"></i>
        </a>
      </div>

      <div class="col-md-4">
        <a href="profil.html" class="card-portal bg-cyan">
          <h5>Data Diri Siswa</h5>
          <i class="bi bi-person-vcard"></i>
        </a>
      </div>

      <div class="col-md-4">
        <a href="absen.html" class="card-portal bg-green">
          <h5>Kehadiran / Absensi</h5>
          <i class="bi bi-patch-check"></i>
        </a>
      </div>

      <div class="col-md-4">
        <a href="rapor.html" class="card-portal bg-purple">
          <h5>E-Rapor Digital</h5>
          <i class="bi bi-file-earmark-medical"></i>
        </a>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function updateDateTime() {
      const now = new Date();
      document.getElementById("datetime").innerText = now.toLocaleTimeString('id-ID') + " WIB";
      
      const hrs = now.getHours();
      let msg = "Selamat Pagi! 🌅";
      if(hrs >= 11 && hrs < 15) msg = "Selamat Siang! ☀️";
      else if(hrs >= 15 && hrs < 18) msg = "Selamat Sore! 🌤️";
      else if(hrs >= 18 || hrs < 5) msg = "Selamat Malam! 🌙";
      document.getElementById("greeting").innerText = msg;
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    async function getWeather() {
      try {
        const res = await fetch(`https://wttr.in/Medan?format=%t+%C`);
        const text = await res.text();
        document.getElementById("weather").innerHTML = `<i class="bi bi-cloud-sun"></i> Medan: ${text.trim()}`;
      } catch {
        document.getElementById("weather").innerText = "Medan: 28°C Berawan";
      }
    }
    getWeather();

    function logout() {
      if(confirm("Keluar dari portal?")) window.location.href = "index.html";
    }
  </script>
</body>
</html>
